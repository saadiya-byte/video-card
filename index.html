<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <!-- HEART -->
        <div class="top-heart">♥</div>

        <!-- TITLE -->
        <h1>Just for You</h1>

        <div class="divider">♥</div>

        <!-- INTRODUCTION -->
        <p class="intro">
            A little something special, made just for you.
        </p>


        <!-- VIDEO -->
        <section class="video-box">

            <video controls playsinline>
                
                <source
                    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4">

                Your browser does not support video playback.

            </video>

        </section>


        <!-- MESSAGE -->
        <h2>A Special Message ❤️</h2>

        <p class="message">
            Some moments are worth keeping forever.
            This video is a little reminder of how special you are.
            I hope it makes you smile.
        </p>


        <!-- FOOTER -->
        <div class="bottom-line">
            ALWAYS &amp; FOREVER
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
