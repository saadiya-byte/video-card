<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just For You ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="top-heart">♥</div>
    <h1>Just for You</h1>
    <div class="divider">♥</div>

    <p class="intro">Scan the QR code on your card to watch a special video made just for you.</p>

    <section class="video-box">
      <div class="video-placeholder">
        <div class="play">▶</div>
        <span>Your video will appear here</span>
      </div>
    </section>

    <h2>A Special Message ❤️</h2>
    <p class="message">
      This video is a small reminder of how special you are to me.
      I hope it makes you smile as much as you make my life brighter.
    </p>

    <div class="bottom-line">ALWAYS &amp; FOREVER</div>
  </main>
</body>
</html>
